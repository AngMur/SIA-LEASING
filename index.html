<script>
/* ════════════════════════════════════════════════════════════════
   ROUTER SPA — carga fragmentos HTML dentro de #content
   ────────────────────────────────────────────────────────────────
   - Cada item del sidebar tiene data-page="nombre" → carga
     ./pages/nombre.html dentro de #content.
   - Los fragmentos NO llevan <html>/<head>/<body>, solo el
     contenido interno (lo que iba dentro de <main class="content">).
   - SIN CACHÉ: cada navegación vuelve a pedir el archivo por fetch
     (fetch con cache:'no-store'), así que un cambio en el archivo
     se refleja sin recargar la página completa.
   - El <script> de cada fragmento se ejecuta con `new Function(...)`
     en vez de insertarse como un nodo <script> en el DOM. Esto es
     necesario incluso sin caché: el TEXTO del archivo es el mismo
     cada vez que vuelves a esa página, y si se inserta dos veces
     como nodo <script>, Chrome puede lanzar "Identifier 'x' has
     already been declared" — incluso si el código está envuelto
     en un IIFE, porque el navegador puede tratar el texto repetido
     como la misma fuente de script. new Function(...) evita esto
     de raíz: cada llamada crea un scope de función nuevo y aislado,
     sin importar cuántas veces se ejecute el mismo texto.
   - La página por defecto al cargar index.html es "cobranza".
   - Funciona con el botón atrás/adelante del navegador vía hash
     (#cobranza, #bancos) y se puede compartir/recargar el link.
   ════════════════════════════════════════════════════════════════ */

const content = document.getElementById('content');
const navItems = document.querySelectorAll('.nav-item[data-page]');

async function loadPage(page, { pushState = true } = {}) {
  // Resalta el link activo
  navItems.forEach(a => a.classList.toggle('active', a.dataset.page === page));

  // Estado de carga
  content.innerHTML = '<div class="loading-state">Cargando…</div>';

  try {
    // Siempre busca el archivo en el servidor, sin usar caché del navegador
    const res = await fetch(`./pages/${page}.html`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`No se encontró ./pages/${page}.html (HTTP ${res.status})`);
    const html = await res.text();

    // Separa <script> del resto del HTML para ejecutarlo aparte
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const scripts = Array.from(tmp.querySelectorAll('script'));
    scripts.forEach(s => s.remove());

    content.innerHTML = tmp.innerHTML;

    // Ejecuta cada <script> del fragmento con new Function(...) — ver nota
    // arriba sobre por qué no se inserta como nodo <script> en el DOM.
    scripts.forEach(oldScript => {
      if (oldScript.src) {
        // Scripts externos sí necesitan insertarse como nodo para que
        // el navegador los descargue y ejecute.
        const s = document.createElement('script');
        s.src = oldScript.src;
        document.body.appendChild(s);
      } else {
        try {
          new Function(oldScript.textContent)();
        } catch (scriptErr) {
          console.error(`Error ejecutando el script de "${page}":`, scriptErr);
        }
      }
    });

    if (pushState) history.pushState({ page }, '', `#${page}`);
  } catch (err) {
    content.innerHTML = `
      <div class="error-state">
        <strong>No se pudo cargar “${page}”.</strong>
        <p>${err.message}</p>
        <p class="hint">Verifica que el servidor local esté corriendo y que el archivo exista en <code>/pages/${page}.html</code>.</p>
      </div>`;
  }
}

navItems.forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    loadPage(a.dataset.page);
  });
});

window.addEventListener('popstate', (e) => {
  const page = (e.state && e.state.page) || location.hash.replace('#', '') || 'cobranza';
  loadPage(page, { pushState: false });
});

// Carga inicial: usa el hash de la URL si existe, si no, "cobranza"
const initialPage = location.hash.replace('#', '') || 'cobranza';
loadPage(initialPage, { pushState: false });
</script>

</body>
</html>
